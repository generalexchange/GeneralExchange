# =====================================================================
# general.exchange — local development environment
# Market data: Interactive Brokers (ib_insync) via ibkr-api service
# =====================================================================

name: general-exchange

x-app-env: &app-env
  REDPANDA_BROKERS: redpanda:9092
  CLICKHOUSE_HOST: clickhouse
  CLICKHOUSE_PORT: "9000"
  CLICKHOUSE_DB: general_exchange
  REDIS_URL: redis://redis:6379/0
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  OPENOBSERVE_URL: http://openobserve:5080
  IBKR_API_URL: http://ibkr-api:8093
  IBKR_API_KEY: ${IBKR_API_KEY:-}
  FLOPPYDISK_URL: ${FLOPPYDISK_URL:-}
  FLOPPYDISK_API_KEY: ${FLOPPYDISK_API_KEY:-}

services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
      - --mode=dev-container
      - --smp=1
      - --default-log-level=info
    ports:
      - "19092:19092"
      - "18081:18081"
      - "18082:18082"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 10

  redpanda-init:
    image: redpandadata/redpanda:v24.2.7
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        RPK="rpk --brokers redpanda:9092"
        create() { $$RPK topic create "$$1" -p "$$2" -r 1 -c retention.ms="$$3" 2>/dev/null || true; }
        create ticks-raw 12 172800000
        create ticks-normalized 12 604800000
        create candles-1m 6 604800000
        create options-chain-snapshots 6 604800000
        create signals 6 604800000
        echo "topics created"
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ibkr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ibkr}
      POSTGRES_DB: ${POSTGRES_DB:-ibkr}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ibkr"]
      interval: 5s
      timeout: 3s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "8123:8123"
      - "9000:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      CLICKHOUSE_DB: general_exchange
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./backend/clickhouse/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    command: server /data --console-address ":9001"
    ports:
      - "9002:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2024-09-16T17-43-14Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
        mc mb -p local/market-data local/backtest-artifacts local/strategies local/model-checkpoints || true;
        echo "buckets ready"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    restart: "no"

  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:latest
    ports:
      - "5080:5080"
    environment:
      ZO_ROOT_USER_EMAIL: ${OO_ROOT_EMAIL:-admin@general.exchange}
      ZO_ROOT_USER_PASSWORD: ${OO_ROOT_PASSWORD:-Complexpass#123}
      ZO_DATA_DIR: /data
    volumes:
      - openobserve-data:/data

  # ------------------------------------------------------------------
  # IBKR API — market data, options, account, orders, WebSocket streams
  # Requires IB Gateway or TWS running on the host (see docs/IBKR_SETUP.md)
  # ------------------------------------------------------------------
  ibkr-api:
    profiles: ["app", "all"]
    build:
      context: ./backend/python
      dockerfile: services/ibkr/Dockerfile
    environment:
      IB_HOST: ${IB_HOST:-host.docker.internal}
      IB_PORT: ${IB_PORT:-4002}
      IB_CLIENT_ID: ${IB_CLIENT_ID:-1}
      IB_PAPER: ${IB_PAPER:-true}
      IB_ACCOUNT: ${IB_ACCOUNT:-}
      IBKR_API_KEY: ${IBKR_API_KEY:-}
      DATABASE_URL: postgresql+asyncpg://ibkr:ibkr@postgres:5432/ibkr
      DATABASE_URL_SYNC: postgresql+psycopg2://ibkr:ibkr@postgres:5432/ibkr
      WS_SYMBOLS: ${WS_SYMBOLS:-SPY,QQQ,NVDA,AAPL,TSLA}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8093:8093"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  monte-carlo-api:
    profiles: ["app", "all"]
    build:
      context: ./backend/python
      dockerfile: services/monte_carlo/Dockerfile
    environment:
      MC_PORT: "8092"
      IBKR_API_URL: http://ibkr-api:8093
      IBKR_API_KEY: ${IBKR_API_KEY:-}
      MC_API_KEY: ${GE_API_KEY:-gx_live_dev_demo_key}
    ports:
      - "8092:8092"
    depends_on:
      - ibkr-api
    restart: unless-stopped

  backtesting-api:
    profiles: ["app", "all"]
    build:
      context: ./backend/python
      dockerfile: services/backtesting/Dockerfile
    environment: *app-env
    ports:
      - "8090:8090"
    depends_on: [clickhouse, minio]
    restart: unless-stopped

  frontend:
    profiles: ["app", "all"]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      IBKR_API_URL: http://ibkr-api:8093
      NEXT_PUBLIC_WS_URL: ws://localhost:8093/ws/stocks?symbols=SPY,QQQ,NVDA
    ports:
      - "3003:3003"
    depends_on:
      - ibkr-api
    restart: unless-stopped

volumes:
  redpanda-data:
  clickhouse-data:
  redis-data:
  minio-data:
  openobserve-data:
  postgres-data:
