# =====================================================================
# general.exchange — local development environment
# =====================================================================
# Approved open-source stack only. No SaaS.
#
# Profiles let you bring up just what you need:
#   docker compose up -d                         # core data plane + app services
#   docker compose --profile bi up -d            # + Apache Superset
#   docker compose --profile etl up -d           # + Apache Airflow
#   docker compose --profile catalog up -d       # + DataHub
#   docker compose --profile all up -d           # everything
#
# Core data plane (always on): redpanda, clickhouse, redis, minio, openobserve
# App services: ingestion + workers (Python), Go API + WS, Next.js frontend
# =====================================================================

name: general-exchange

x-app-env: &app-env
  REDPANDA_BROKERS: redpanda:9092
  CLICKHOUSE_HOST: clickhouse
  CLICKHOUSE_PORT: "9000"
  CLICKHOUSE_DB: general_exchange
  REDIS_URL: redis://redis:6379/0
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  OPENOBSERVE_URL: http://openobserve:5080
  POLYGON_API_KEY: ${POLYGON_API_KEY:-}
  # FloppyDisk (floppydisk.cc) — external strategy-storage service. Leave the
  # URL empty to use the local MinIO-backed stand-in; set it to point the
  # backtesting engine at the real service once it ships.
  FLOPPYDISK_URL: ${FLOPPYDISK_URL:-}
  FLOPPYDISK_API_KEY: ${FLOPPYDISK_API_KEY:-}

services:
  # ------------------------------------------------------------------
  # Redpanda — Kafka-compatible event streaming (single binary)
  # ------------------------------------------------------------------
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
      - --mode=dev-container
      - --smp=1
      - --default-log-level=info
    ports:
      - "19092:19092" # kafka (external)
      - "18081:18081" # schema registry
      - "18082:18082" # pandaproxy / REST
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: create all topics with symbol partitioning + retention.
  redpanda-init:
    image: redpandadata/redpanda:v24.2.7
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        RPK="rpk --brokers redpanda:9092"
        create() { $$RPK topic create "$$1" -p "$$2" -r 1 -c retention.ms="$$3" 2>/dev/null || true; }
        # 48h retention for raw ticks
        create ticks-raw 12 172800000
        create ticks-normalized 12 604800000
        create candles-1m 6 604800000
        create candles-5m 6 604800000
        create candles-15m 6 604800000
        create candles-1h 6 604800000
        create candles-1d 6 2592000000
        create options-chain-snapshots 6 604800000
        create signals 6 604800000
        create paper-trade-events 3 2592000000
        create news-raw 3 604800000
        create news-processed 3 2592000000
        create regime-events 3 2592000000
        echo "topics created"
    restart: "no"

  # ------------------------------------------------------------------
  # ClickHouse — primary data warehouse / system of record
  # ------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "8123:8123" # HTTP
      - "9000:9000" # native TCP
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      CLICKHOUSE_DB: general_exchange
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      # Migrations are auto-applied on first boot from this dir.
      - ./backend/clickhouse/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ------------------------------------------------------------------
  # Redis — cache for Greeks, chain snapshots, live signal state, WS fan-out
  # ------------------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  # ------------------------------------------------------------------
  # MinIO — S3-compatible object storage (Parquet, backtest artifacts,
  # strategy files, model checkpoints). Backend for the FloppyDisk layer.
  # ------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    command: server /data --console-address ":9001"
    ports:
      - "9002:9000" # S3 API (9000 reserved for ClickHouse native on host)
      - "9001:9001" # console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2024-09-16T17-43-14Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
        mc mb -p local/market-data local/backtest-artifacts local/strategies local/model-checkpoints || true;
        echo "buckets ready"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    restart: "no"

  # ------------------------------------------------------------------
  # OpenObserve — logs, metrics, traces, trading + system events
  # ------------------------------------------------------------------
  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:latest
    ports:
      - "5080:5080"
    environment:
      ZO_ROOT_USER_EMAIL: ${OO_ROOT_EMAIL:-admin@general.exchange}
      ZO_ROOT_USER_PASSWORD: ${OO_ROOT_PASSWORD:-Complexpass#123}
      ZO_DATA_DIR: /data
    volumes:
      - openobserve-data:/data

  # ==================================================================
  # APPLICATION SERVICES (built from ./backend) — profile: app
  # Each Dockerfile is scaffolded per phase of the build plan.
  # ==================================================================
  polygon-ingestion-service:
    profiles: ["app", "all"]
    build: { context: ./backend/python, dockerfile: services/polygon_ingestion/Dockerfile }
    environment: *app-env
    depends_on: [redpanda, redis]
    restart: unless-stopped

  # Unified Node WebSocket server — same image dev + prod (port 3001, path /ws)
  ws-server:
    profiles: ["app", "all"]
    build: { context: ./services/ws-server, dockerfile: Dockerfile }
    environment:
      WS_PORT: "3001"
      POLYGON_API_KEY: ${POLYGON_API_KEY:-}
      WS_SYMBOLS: ${WS_SYMBOLS:-SPY,QQQ,NVDA,AAPL,TSLA,AMD}
      NODE_ENV: production
    ports:
      - "3001:3001"
    restart: unless-stopped

  tick-normalizer:
    profiles: ["app", "all"]
    build: { context: ./backend/python, dockerfile: services/tick_normalizer/Dockerfile }
    environment: *app-env
    depends_on: [redpanda, clickhouse]
    restart: unless-stopped

  candle-aggregation-service:
    profiles: ["app", "all"]
    build: { context: ./backend/python, dockerfile: services/candle_aggregation/Dockerfile }
    environment: *app-env
    depends_on: [redpanda]
    restart: unless-stopped

  options-chain-service:
    profiles: ["app", "all"]
    build: { context: ./backend/python, dockerfile: services/options_chain/Dockerfile }
    environment: *app-env
    depends_on: [redpanda, clickhouse, redis]
    restart: unless-stopped

  signal-computation-worker:
    profiles: ["app", "all"]
    build: { context: ./backend/python, dockerfile: services/signal_worker/Dockerfile }
    environment: *app-env
    depends_on: [redpanda, clickhouse, redis]
    restart: unless-stopped

  news-nlp-worker:
    profiles: ["app", "all"]
    build: { context: ./backend/python, dockerfile: services/news_nlp/Dockerfile }
    environment: *app-env
    depends_on: [redpanda, clickhouse]
    restart: unless-stopped

  regime-detection-worker:
    profiles: ["app", "all"]
    build: { context: ./backend/python, dockerfile: services/regime_detection/Dockerfile }
    environment: *app-env
    depends_on: [redpanda, clickhouse]
    restart: unless-stopped

  data-quality-worker:
    profiles: ["app", "all"]
    build: { context: ./backend/python, dockerfile: services/data_quality/Dockerfile }
    environment: *app-env
    depends_on: [clickhouse]
    restart: unless-stopped

  backtesting-api:
    profiles: ["app", "all"]
    build: { context: ./backend/python, dockerfile: services/backtesting/Dockerfile }
    environment: *app-env
    ports:
      - "8090:8090"
    depends_on: [clickhouse, minio]
    restart: unless-stopped

  go-api-server:
    profiles: ["app", "all"]
    build: { context: ./backend/go, dockerfile: cmd/api/Dockerfile }
    environment:
      <<: *app-env
      HTTP_ADDR: ":8080"
      BACKTEST_API_URL: http://backtesting-api:8090
      CLICKHOUSE_HTTP_PORT: "8123"
      API_KEY_ENFORCE: ${API_KEY_ENFORCE:-false}
      DEV_API_KEY: ${DEV_API_KEY:-gx_live_dev_demo_key}
    ports:
      - "8080:8080"
    depends_on: [clickhouse, redis, backtesting-api]
    restart: unless-stopped

  go-websocket-server:
    profiles: ["app", "all"]
    build: { context: ./backend/go, dockerfile: cmd/ws/Dockerfile }
    environment:
      <<: *app-env
      WS_ADDR: ":8081"
    ports:
      - "8081:8081"
    depends_on: [redpanda, redis]
    restart: unless-stopped

  frontend:
    profiles: ["app", "all"]
    build: { context: ., dockerfile: Dockerfile }
    environment:
      GO_API_URL: http://go-api-server:8080
      GO_WS_URL: ws://go-websocket-server:8081
    ports:
      - "3003:3003"
    depends_on: [go-api-server]
    restart: unless-stopped

  # ==================================================================
  # Apache Superset — internal BI over ClickHouse — profile: bi
  # ==================================================================
  superset:
    profiles: ["bi", "all"]
    image: apache/superset:4.0.2
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-change-me-in-prod}
    volumes:
      - superset-data:/app/superset_home
    depends_on: [clickhouse]

  # ==================================================================
  # Apache Airflow — ETL / pipeline orchestration — profile: etl
  # ==================================================================
  airflow-postgres:
    profiles: ["etl", "all"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-pg-data:/var/lib/postgresql/data

  airflow-webserver:
    profiles: ["etl", "all"]
    image: apache/airflow:2.10.2
    command: webserver
    ports:
      - "8085:8080"
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - ./backend/airflow/dags:/opt/airflow/dags
    depends_on: [airflow-postgres]

  airflow-scheduler:
    profiles: ["etl", "all"]
    image: apache/airflow:2.10.2
    command: scheduler
    environment: *airflow-env
    volumes:
      - ./backend/airflow/dags:/opt/airflow/dags
    depends_on: [airflow-postgres]

  airflow-worker:
    profiles: ["etl", "all"]
    image: apache/airflow:2.10.2
    command: celery worker
    environment: *airflow-env
    volumes:
      - ./backend/airflow/dags:/opt/airflow/dags
    depends_on: [airflow-postgres]

  # ==================================================================
  # DataHub — data catalog / lineage — profile: catalog
  # (DataHub also requires kafka+es+mysql; use the upstream quickstart
  #  compose for a full deploy. These are the GMS + frontend faces.)
  # ==================================================================
  datahub-gms:
    profiles: ["catalog", "all"]
    image: acryldata/datahub-gms:head
    ports:
      - "8087:8080"
    environment:
      KAFKA_BOOTSTRAP_SERVER: redpanda:9092
    depends_on: [redpanda]

  datahub-frontend:
    profiles: ["catalog", "all"]
    image: acryldata/datahub-frontend-react:head
    ports:
      - "9003:9002"
    environment:
      DATAHUB_GMS_HOST: datahub-gms
      DATAHUB_GMS_PORT: "8080"
    depends_on: [datahub-gms]

volumes:
  redpanda-data:
  clickhouse-data:
  redis-data:
  minio-data:
  openobserve-data:
  superset-data:
  airflow-pg-data:
