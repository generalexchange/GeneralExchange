# Fly.io — unified WebSocket server (same image as docker-compose ws-server)
# Deploy: fly deploy --config services/ws-server/fly.toml
# Requires: fly auth login + fly secrets set POLYGON_API_KEY=...

app = 'general-exchange-ws'
primary_region = 'iad'

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    path = '/health'
    timeout = '5s'

[env]
  NODE_ENV = 'production'
  WS_PORT = '3001'
  WS_SYMBOLS = 'SPY,QQQ,NVDA,AAPL,TSLA,AMD'
