# Go REST API on DigitalOcean — Polygon via Redis-backed cache
name: general-exchange-go-api
region: nyc

databases:
  - name: market-cache
    engine: REDIS
    version: "7"
    production: false

services:
  - name: go-api
    source_dir: backend/go
    dockerfile_path: backend/go/cmd/api/Dockerfile
    github:
      repo: generalexchange/GeneralExchange
      branch: main
      deploy_on_push: true
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /healthz
      initial_delay_seconds: 25
      period_seconds: 30
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: HTTP_ADDR
        value: ":8080"
        scope: RUN_TIME
      - key: API_KEY_ENFORCE
        value: "false"
        scope: RUN_TIME
      - key: REDIS_URL
        value: ${market-cache.REDIS_URL}
        scope: RUN_TIME
      - key: POLYGON_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: DEV_API_KEY
        value: gx_live_dev_demo_key
        scope: RUN_TIME
