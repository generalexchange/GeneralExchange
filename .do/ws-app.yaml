# Go WebSocket server — Massive client-go live feed
name: general-exchange-ws
region: nyc

services:
  - name: ws
    source_dir: backend/go
    dockerfile_path: backend/go/cmd/ws/Dockerfile
    github:
      repo: generalexchange/GeneralExchange
      branch: main
      deploy_on_push: true
    http_port: 8081
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /health
      initial_delay_seconds: 25
      period_seconds: 30
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: WS_ADDR
        value: ":8081"
        scope: RUN_TIME
      - key: MASSIVE_WS_FEED
        value: Delayed
        scope: RUN_TIME
      - key: WS_SYMBOLS
        value: SPY,QQQ,NVDA,AAPL,TSLA,AMD,MSFT,AMZN,META
        scope: RUN_TIME
      - key: POLYGON_API_KEY
        scope: RUN_TIME
        type: SECRET
