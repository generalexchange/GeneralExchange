# DigitalOcean App Platform — WebSocket server only.
# Next.js stays on Vercel. Do NOT deploy the repo root with Node buildpacks.
#
# In DO dashboard: App → Settings → set "Source directory" to services/ws-server
# or import this spec. Component type must be Docker (not Node buildpack).

name: general-exchange-ws
region: nyc

services:
  - name: ws
    source_dir: services/ws-server
    dockerfile_path: Dockerfile
    github:
      repo: generalexchange/GeneralExchange
      branch: main
      deploy_on_push: true
    http_port: 3001
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /
    health_check:
      http_path: /health
      initial_delay_seconds: 20
      period_seconds: 30
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: NODE_ENV
        value: production
        scope: RUN_AND_BUILD_TIME
      - key: WS_PORT
        value: "3001"
        scope: RUN_TIME
      - key: WS_SYMBOLS
        value: SPY,QQQ,NVDA,AAPL,TSLA,AMD
        scope: RUN_TIME
      - key: POLYGON_API_KEY
        scope: RUN_TIME
        type: SECRET
