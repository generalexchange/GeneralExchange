# IBKR market data + account API (FastAPI / ib_insync)
# Requires IB Gateway reachable at IB_HOST (see infra/digitalocean/gateway-compose.yml)
name: general-exchange-ibkr
region: nyc

databases:
  - name: ibkr-db
    engine: PG
    version: "16"
    production: false

services:
  - name: ibkr-api
    source_dir: backend/python
    dockerfile_path: backend/python/services/ibkr/Dockerfile
    github:
      repo: generalexchange/GeneralExchange
      branch: main
      deploy_on_push: true
    http_port: 8093
    instance_count: 1
    instance_size_slug: basic-s
    health_check:
      http_path: /health
      initial_delay_seconds: 120
      period_seconds: 30
      timeout_seconds: 10
      failure_threshold: 6
    envs:
      - key: IB_HOST
        value: "127.0.0.1"
        scope: RUN_TIME
      - key: IB_PORT
        value: "4002"
        scope: RUN_TIME
      - key: IB_CLIENT_ID
        value: "1"
        scope: RUN_TIME
      - key: IB_PAPER
        value: "true"
        scope: RUN_TIME
      - key: DATABASE_URL
        value: ${ibkr-db.DATABASE_URL}
        scope: RUN_TIME
      - key: IBKR_API_KEY
        value: "gx_ibkr_dev_key"
        scope: RUN_TIME
      - key: WS_SYMBOLS
        value: SPY,QQQ,NVDA,AAPL,TSLA,AMD,MSFT,AMZN,META
        scope: RUN_TIME
      - key: TRADING_MODE
        value: paper
        scope: RUN_TIME
      - key: READ_ONLY_API
        value: "no"
        scope: RUN_TIME
      - key: TWS_ACCEPT_INCOMING
        value: accept
        scope: RUN_TIME
      - key: EXISTING_SESSION_DETECTED_ACTION
        value: primary
        scope: RUN_TIME
      - key: TWOFA_TIMEOUT_ACTION
        value: restart
        scope: RUN_TIME
      - key: RELOGIN_AFTER_TWOFA_TIMEOUT
        value: "yes"
        scope: RUN_TIME
