name: Deploy WS Server

on:
  push:
    branches: [main]
    paths:
      - 'services/ws-server/**'
      - 'services/ws-server/fly.toml'
      - 'render.yaml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ws-server-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        id: deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: |
          set -e
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::warning::FLY_API_TOKEN GitHub secret is not set — run scripts/deploy-production-ws.ps1 -FlyToken 'FlyV1 ...'"
            exit 0
          fi
          export FLYCTL_ACCESS_TOKEN="$FLY_API_TOKEN"
          if ! flyctl apps list 2>/dev/null | grep -q 'general-exchange-ws'; then
            flyctl apps create general-exchange-ws || true
          fi
          flyctl deploy --remote-only --config services/ws-server/fly.toml --app general-exchange-ws
          if [ -n "$POLYGON_API_KEY" ]; then
            flyctl secrets set POLYGON_API_KEY="$POLYGON_API_KEY" --app general-exchange-ws
          fi
          echo "deployed=true" >> "$GITHUB_OUTPUT"
          echo "WS health: https://general-exchange-ws.fly.dev/health"
          echo "WS endpoint: wss://general-exchange-ws.fly.dev/ws"

      - name: Smoke test
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then exit 0; fi
          sleep 15
          curl -fsS "https://general-exchange-ws.fly.dev/health" && echo " OK"

      - name: Update Vercel WS URL
        if: steps.deploy.outputs.deployed == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::VERCEL_TOKEN / VERCEL_PROJECT_ID not set — update NEXT_PUBLIC_WS_URL manually"
            exit 0
          fi
          WS_URL="wss://general-exchange-ws.fly.dev/ws"
          curl -fsS -X POST "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"key\":\"NEXT_PUBLIC_WS_URL\",\"value\":\"${WS_URL}\",\"type\":\"encrypted\",\"target\":[\"production\",\"preview\"]}"
          echo "Set NEXT_PUBLIC_WS_URL=${WS_URL} on Vercel"
