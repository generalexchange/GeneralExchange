name: Desktop — Build & Release

# Builds the general.exchange desktop app for macOS, Windows, and Linux. The
# Tauri shell (apps/desktop) bundles the FULL general.exchange site: the build
# compiles the root Next.js app to a static export (scripts/build-desktop-frontend.mjs
# -> out/) which ships inside the installer. Produces downloadable installers,
# uploads them as GitHub Actions artifacts, and (on a version tag or published
# release) attaches them to a GitHub Release as a draft.
#
# Triggers:
#   - Git tags matching v*        -> build + draft release
#   - Published GitHub Releases   -> build + attach assets
#   - Manual (workflow_dispatch)  -> build + artifacts only
#   - Pushes to main touching the app -> build + artifacts only (CI check)

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'apps/desktop/**'
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'next.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop-release.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # universal-apple-darwin is a Tauri CLI flag, NOT a rustup target.
          # Install aarch64 + x86_64 via rustup, then let Tauri lipo them.
          - platform: macos-latest
            rust-targets: ''
            args: '--target universal-apple-darwin'
            artifact: macos-installers
          - platform: ubuntu-22.04
            rust-targets: x86_64-unknown-linux-gnu
            args: ''
            artifact: linux-installers
          - platform: windows-latest
            rust-targets: x86_64-pc-windows-msvc
            args: ''
            artifact: windows-installers

    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Add macOS Rust targets (universal build)
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install desktop shell dependencies
        run: npm ci

      - name: Install web app dependencies (bundled UI)
        working-directory: ${{ github.workspace }}
        run: npm ci

      - name: Build & release with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ---------------------------------------------------------------
          # CODE SIGNING (disabled until certificates exist).
          # To enable, add the matching repository secrets under
          # Settings > Secrets and variables > Actions, then uncomment.
          #
          # macOS signing + notarization:
          #   APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          #   APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          #   APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          #   APPLE_ID: ${{ secrets.APPLE_ID }}
          #   APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          #   APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          #
          # Windows Authenticode signing:
          #   (configure bundle.windows.certificateThumbprint in tauri.conf.json,
          #    or use a signCommand — see apps/desktop/README.md)
          #
          # Tauri updater signing (for auto-updates):
          #   TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          #   TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # ---------------------------------------------------------------
        with:
          projectPath: apps/desktop
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'general.exchange ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          assetNamePattern: 'General-Exchange_[arch][setup].[ext]'
          args: ${{ matrix.args }}

      - name: Upload installers as workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            apps/desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/**/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/**/release/bundle/macos/*.app.tar.gz
            apps/desktop/src-tauri/target/**/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/**/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/**/release/bundle/rpm/*.rpm
