# DigitalOcean backend deploy (Option A)
# Vercel = Next.js UI only. WS + Go API + Python Monte Carlo = DO.

name: Deploy backend to DigitalOcean

on:
  push:
    branches: [main]
    paths:
      - 'services/ws-server/**'
      - 'backend/go/**'
      - 'backend/python/**'
      - '.do/app.yaml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Deploy app spec
        run: doctl apps create --spec .do/app.yaml --upsert --wait

      - name: Update Vercel env (optional)
        if: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_PROJECT_ID != '' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          APP_ID=$(doctl apps list --format ID,Spec.Name --no-header | awk '$2=="general-exchange-backend"{print $1; exit}')
          if [ -z "$APP_ID" ]; then echo "App not found"; exit 0; fi
          SPEC=$(doctl apps spec get "$APP_ID" -o json)
          WS=$(echo "$SPEC" | python3 -c "import json,sys; d=json.load(sys.stdin); print([s.get('ingress',{}).get('rules',[{}])[0] for s in [d]][0])" 2>/dev/null || true)
          # Component default ingress URLs from doctl
          doctl apps list --format ID,DefaultIngress,Spec.Name --no-header
          echo "Set Vercel NEXT_PUBLIC_WS_URL, GO_API_URL, MONTE_CARLO_API_URL from DO dashboard URLs"
