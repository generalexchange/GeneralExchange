# Deploy IBKR + Monte Carlo to DigitalOcean when credentials are configured.

name: Deploy IBKR stack to DigitalOcean

on:
  push:
    branches: [main]
    paths:
      - 'backend/python/**'
      - '.do/**'
      - 'infra/digitalocean/**'
      - '.github/workflows/do-ibkr-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to DigitalOcean
        env:
          DO_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          if [ -z "$DO_TOKEN" ]; then
            echo "::notice::DIGITALOCEAN_ACCESS_TOKEN is not set — skipping IBKR stack deploy."
            echo "Add the secret under Settings → Secrets and variables → Actions to enable auto-deploy."
            exit 0
          fi

          curl -sSL "https://github.com/digitalocean/doctl/releases/download/v1.163.0/doctl-1.163.0-linux-amd64.tar.gz" | tar xz
          sudo mv doctl /usr/local/bin/doctl

          doctl auth init -t "$DO_TOKEN"
          doctl apps create --spec .do/ibkr-app.yaml --upsert --wait
          doctl apps create --spec .do/monte-carlo-app.yaml --upsert --wait
          doctl apps list --format Spec.Name,DefaultIngress
