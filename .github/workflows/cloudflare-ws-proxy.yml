name: Deploy Cloudflare WS Proxy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'infra/cloudflare/**'
      - '.github/workflows/cloudflare-ws-proxy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy Worker
        working-directory: infra/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets not set — skip"
            exit 0
          fi
          npm install -g wrangler
          printf '%s' 'https://general-exchange-ws.fly.dev' | wrangler secret put WS_ORIGIN
          wrangler deploy --routes "general.exchange/ws*"
