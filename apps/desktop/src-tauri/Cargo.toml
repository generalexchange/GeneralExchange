[package]
name = "general-exchange-terminal"
version = "0.1.0"
description = "General Exchange desktop trading terminal"
authors = ["General Exchange"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-stronghold = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust-argon2 = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
