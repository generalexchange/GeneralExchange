# IB Gateway on your local machine (Docker optional — or run IB Gateway natively on Windows/Mac).
#
#   cd infra/local
#   cp .env.example .env   # fill TWS_USERID / TWS_PASSWORD
#   docker compose up -d
#
# Paper API port: 4002  |  VNC (2FA): 5900

services:
  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:stable
    restart: unless-stopped
    env_file: .env
    ports:
      - "4002:4002"
      - "5900:5900"
    volumes:
      - jts-data:/home/ibgateway/Jts
      - ./secrets/tws_password:/run/secrets/tws_password:ro
    ulimits:
      nofile:
        soft: 10000
        hard: 10000

volumes:
  jts-data:
