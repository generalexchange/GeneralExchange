# Run IB Gateway on a DigitalOcean Droplet (Ubuntu 22.04, 1GB+ RAM).
# After login to Gateway, set IB_HOST on the App Platform ibkr-api service to this droplet's IP.
#
#   docker compose -f gateway-compose.yml up -d
#
# Default ports: 4002 (paper API), 5900 (VNC for 2FA if needed)

services:
  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:stable
    restart: unless-stopped
    env_file: .env
    ports:
      - "4002:4002"
      - "5900:5900"
    volumes:
      - jts-data:/home/ibgateway/Jts
      # Prefer TWS_PASSWORD_FILE in .env so special chars (e.g. !) are not mangled.
      - ./secrets/tws_password:/run/secrets/tws_password:ro
    ulimits:
      nofile:
        soft: 10000
        hard: 10000

volumes:
  jts-data:
