services:
  - type: web
    name: general-exchange-ws
    runtime: docker
    dockerfilePath: services/ws-server/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: WS_PORT
        value: 3001
      - key: WS_SYMBOLS
        value: SPY,QQQ,NVDA,AAPL,TSLA,AMD
      - key: POLYGON_API_KEY
        sync: false
